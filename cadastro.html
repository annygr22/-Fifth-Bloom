
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | FIFTH BLOOM</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div id="header-container"></div>

    <main class="area-login">

        <div class="conteudo-login">

            <img
                src="assets/logo_Fifth_Blom.png"
                alt="Fifth Bloom"
                class="logo-painel"
            >

            <section class="painel-login">

                <h1>Crie sua conta!</h1>

                <p>Preencha seus dados para fazer parte da FIFTH BLOOM.</p>

                <form id="form-cadastro">

                    <label for="nome">Nome completo:</label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        autocomplete="name"
                        required
                    >

                    <label for="email">E-mail:</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >

                    <label for="senha">Senha:</label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Crie uma senha"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                    <label for="confirmar-senha">Confirmar senha:</label>

                    <input
                        type="password"
                        id="confirmar-senha"
                        placeholder="Digite a senha novamente"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                    <p id="mensagem-cadastro" role="alert"></p>

                    <button type="submit" class="continuar">
                        CRIAR CONTA
                    </button>

                </form>

                <div class="divisor">
                    <span></span>
                    <p>OU</p>
                    <span></span>
                </div>

                <button
                    type="button"
                    class="google"
                    id="cadastro-google"
                >
                    <img src="./assets/LOGO_GOOGLE.png" alt="Google">
                    Cadastrar com Google
                </button>

                <p class="criar-conta">
                    Já possui uma conta?
                    <a href="login.html">Entrar</a>
                </p>

            </section>

        </div>

    </main>

    <footer class="rodape-home">
        <div class="newsletter">
            <h3>NEWSLETTER</h3>
            <p>Receba novidades e promoções exclusivas</p>
        </div>
    </footer>

    <script src="./js/include-header.js"></script>
    <script src="./js/script.js"></script>
    <script type="module" src="./js/cadastro.js"></script>

</body>
</html>
