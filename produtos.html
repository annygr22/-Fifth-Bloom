
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Produtos | FIFTH BLOOM</title>

    <!-- FONTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="produtos.css">
</head>

<body>

    <!-- CABEÇALHO COMPARTILHADO -->
    <div id="header-container"></div>

    <!-- CONTEÚDO DA PÁGINA -->
    <main class="pagina-produtos">

        <section class="titulo-produtos">

            <h1>PRODUTOS</h1>

            <p>
                PRODUTOS FEITOS PARA REALÇAR SUA BELEZA NATURAL.
            </p>

        </section>

        <div class="conteudo-produtos">

            <!-- FILTROS LATERAIS -->
            <aside class="filtros">

                <h3>Categorias</h3>

                <label>
                    <input type="checkbox" name="categoria" value="skincare">
                    Skincare
                </label>

                <label>
                    <input type="checkbox" name="categoria" value="corpo">
                    Corpo
                </label>

                <label>
                    <input type="checkbox" name="categoria" value="maquiagem">
                    Maquiagem
                </label>

                <label>
                    <input type="checkbox" name="categoria" value="hidratantes">
                    Hidratantes
                </label>

                <label>
                    <input type="checkbox" name="categoria" value="mais-vendidos">
                    Mais vendidos
                </label>

                <hr>

                <h3>Preço</h3>

                <label>
                    <input type="checkbox" name="preco" value="0-50">
                    R$0 – R$50
                </label>

                <label>
                    <input type="checkbox" name="preco" value="50-100">
                    R$50 – R$100
                </label>

                <label>
                    <input type="checkbox" name="preco" value="100">
                    R$100+
                </label>

                <button class="limpar-filtros" type="button"
                    onclick="limparFiltros()">
                    LIMPAR FILTROS
                </button>

            </aside>

            <!-- CATÁLOGO DE PRODUTOS -->
            <section class="catalogo">

                <div class="ordenacao">

                    <label for="ordenar">Ordenar por:</label>

                    <select id="ordenar">
                        <option value="padrao">Padrão</option>
                        <option value="menor">Menor preço</option>
                        <option value="maior">Maior preço</option>
                        <option value="nome">Nome</option>
                    </select>

                </div>

                <div class="grade-produtos" id="gradeProdutos">

                    <!-- Produtos inseridos pelo JavaScript -->

                </div>

            </section>

        </div>

    </main>

    <!-- RODAPÉ -->
    <footer class="rodape-home">

        <div class="newsletter">
            <h3>NEWSLETTER</h3>
            <p>Receba novidades e promoções exclusivas</p>

            <form>
                <input type="email" placeholder="Seu e-mail" required>
                <button type="submit">→</button>
            </form>
        </div>

        <div class="redes-sociais">
            <h3>SIGA A FIFTH BLOOM</h3>

            <div class="redes-icones">
                <a href="#" aria-label="Instagram">◎</a>
                <a href="#" aria-label="TikTok">♪</a>
                <a href="#" aria-label="YouTube">▶</a>
                <a href="#" aria-label="Pinterest">℗</a>
            </div>
        </div>

        <div class="pagamentos">
            <h3>FORMAS DE PAGAMENTO</h3>

            <div class="pagamento-icones">
                <span>VISA</span>
                <span>●●</span>
                <span>PIX</span>
                <span>AMEX</span>
                <span>Pay</span>
            </div>
        </div>

    </footer>

    <!-- JAVASCRIPT -->
    <script src="./js/include-header.js"></script>
    <script src="./js/script.js"></script>
    <script src="./js/produtos.js"></script>
    <script src="./js/sacola.js"></script>

</body>
</html>
